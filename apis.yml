name: OSCAR EMR
kind: company
description: >-
  OSCAR EMR is an open-source electronic medical record (EMR) system created by Dr. David
  Chan and McMaster University's Department of Family Medicine, and one of Canada's most
  widely deployed primary-care EMRs. The core software is distributed under the GPL v2+
  license (mirrored on GitHub as scoophealth/oscar and on Bitbucket), while the commercially
  supported OSCAR Pro distribution is delivered by the WELL EMR Group (a WELL Health company)
  to more than 2,000 clinics and 10,000 providers across Canada. OSCAR exposes a documented
  REST web-services API under the /ws/services path (scheduling, demographics, billing,
  prescriptions, documents, labs, ticklers, eForms and providers), secured with 3-legged
  OAuth 1.0a via /ws/oauth. Clinical data flows historically use HL7 v2 messaging, and OSCAR
  ships an internal HL7 FHIR integration used for Ontario public-health and immunization
  reporting (BORN, DHIR). Third-party integrations for OSCAR Pro are partner-gated through
  the apps.health marketplace. As self-hosted software there is no single public API host or
  hosted FHIR CapabilityStatement; the API surface is documented on the OSCAR EMR developer
  wiki and realized per clinic deployment.
